<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ฮัฌ & ฝ้าย</title>
<meta name="description" content="ของขวัญเล็กๆ สำหรับฝ้าย 🤍">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#090807">
<link rel="icon" href="img/heart.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="lock" class="lock-page">
<main class="experience">
  <div class="backgrounds" aria-hidden="true">
    <img class="background is-visible" src="img/shadow.jpg" alt="" style="--pos:50% 45%">
  </div>
  <div class="shade" aria-hidden="true"></div>

  <section class="lock" id="lock" aria-label="ใส่รหัส">
    <img class="lock-heart" src="img/heart.svg" alt="">
    <div class="lock-kicker">สำหรับฝ้าย</div>
    <h1 class="lock-title">ใส่วันครบรอบของเรา</h1>
    <p class="lock-sub" id="lock-sub" aria-live="polite">รหัส 6 หลัก</p>
    <div class="slots" id="slots" aria-hidden="true">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" type="button" data-k="1">1</button>
      <button class="key" type="button" data-k="2">2</button>
      <button class="key" type="button" data-k="3">3</button>
      <button class="key" type="button" data-k="4">4</button>
      <button class="key" type="button" data-k="5">5</button>
      <button class="key" type="button" data-k="6">6</button>
      <button class="key" type="button" data-k="7">7</button>
      <button class="key" type="button" data-k="8">8</button>
      <button class="key" type="button" data-k="9">9</button>
      <span></span>
      <button class="key" type="button" data-k="0">0</button>
      <button class="key ghost" type="button" data-k="del" aria-label="ลบ">⌫</button>
    </div>
  </section>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/lock.js"></script>
</body>
</html>
